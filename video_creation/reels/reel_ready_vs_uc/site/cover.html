<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
@font-face { font-family: Poppins; font-weight: 400; src: url(a/Poppins-Regular.ttf); }
@font-face { font-family: Poppins; font-weight: 500; src: url(a/Poppins-Medium.ttf); }
@font-face { font-family: Poppins; font-weight: 600; src: url(a/Poppins-SemiBold.ttf); }
@font-face { font-family: Poppins; font-weight: 700; src: url(a/Poppins-Bold.ttf); }
@font-face { font-family: Poppins; font-weight: 800; src: url(a/Poppins-ExtraBold.ttf); }
html, body { margin: 0; background: #05080f; color: #ddd; font: 14px Poppins, sans-serif; }
#wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
canvas { width: auto; height: 86vh; aspect-ratio: 9/16; background: #000; }
body.render #ui { display: none; }
body.render canvas { width: 1080px; height: 1920px; }
body.render #wrap { padding: 0; }
#ui { display: flex; gap: 8px; align-items: center; width: min(90vw, 600px); }
#ui input { flex: 1; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui"><button id="play">Play</button><input id="pos" type="range" min="0" max="1" step="0.001" value="0"><span id="time">0.00</span></div>
</div>
<audio id="vo" src="../vo.mp3" preload="auto"></audio>
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="lib.js"></script>
<script src="cover.js"></script>
<script>
(async () => {
  if (location.search.includes('render')) document.body.classList.add('render');
  initCanvas();
  await loadFonts();
  await loadImages(ASSETS);
  build();
  E.sfx.sort((a, b) => a.t - b.t);
  window.READY = true;
  seek(0);
  // simple preview player (not used by render.py)
  const vo = document.getElementById('vo'), pos = document.getElementById('pos'), tl = document.getElementById('time');
  let playing = false;
  const show = t => { seek(t); pos.value = t / E.duration; tl.textContent = t.toFixed(2); };
  document.getElementById('play').onclick = () => { playing = !playing; playing ? vo.play() : vo.pause(); };
  pos.oninput = () => { vo.currentTime = pos.value * E.duration; show(vo.currentTime); };
  (function loop() { if (playing) show(vo.currentTime); requestAnimationFrame(loop); })();
})().catch(e => { window.LOAD_ERROR = String(e); console.error(e); });
</script>
</body>
</html>
