  uniforms:{sun:{value:SUN},night:{value:0}},
  vertexShader:`varying vec3 vd;void main(){vd=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vd;uniform vec3 sun;uniform float night;

    float s=max(dot(vd,sun),0.);c+=vec3(1.,.66,.36)*(pow(s,8.)*.55+pow(s,180.)*2.5)*(1.-night*.7);

{const g=new THREE.Mesh(new THREE.CircleGeometry(100,24),new THREE.MeshBasicMaterial({color:0x6e655a}));g.rotation.x=-Math.PI/2;g.position.y=-2;envScene.add(g)}

  for(const [x0,cw] of (lit?[[18,90],[300,70],[420,80]]:[[18,60],[430,60]])){g.fillStyle=lit?'rgba(255,236,200,.85)':'rgba(215,200,180,.55)';
    for(let k=0;k<cw;k+=10){g.fillRect(x0+k,10,7,h-20)}}

  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.3*s,3.6*s,7),MS({color:0x6b5240,roughness:1}));tr.position.y=1.8*s;tr.castShadow=true;g.add(tr);
  for(let k=0;k<7;k++){const r=(1.1+R()*.9)*s;const b=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),leafMats[(R()*5)|0]);
