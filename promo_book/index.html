<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:400;src:url(a/Poppins-Regular.ttf)}
@font-face{font-family:P;font-weight:500;src:url(a/Poppins-Medium.ttf)}
@font-face{font-family:P;font-weight:600;src:url(a/Poppins-SemiBold.ttf)}
@font-face{font-family:P;font-weight:700;src:url(a/Poppins-Bold.ttf)}
@font-face{font-family:P;font-weight:800;src:url(a/Poppins-ExtraBold.ttf)}
@font-face{font-family:P;font-weight:900;src:url(a/Poppins-Black.ttf)}
html,body{margin:0;background:#000}
#root{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:P,sans-serif;
 background:radial-gradient(ellipse 90% 60% at 50% 38%,#163066 0%,#0b1a3d 45%,#050a1a 100%)}
#grid{position:absolute;inset:-200px;opacity:.10;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:90px 90px;
 -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 50%,#000 30%,transparent 80%)}
#spot{position:absolute;left:50%;top:-300px;width:1400px;height:1900px;margin-left:-700px;background:radial-gradient(ellipse 40% 60% at 50% 0%,rgba(255,226,150,.30),rgba(255,226,150,0) 70%);pointer-events:none}
#tint{position:absolute;inset:0;pointer-events:none}
canvas{position:absolute;left:0;top:0}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
#stage{position:absolute;inset:0}
.item{position:absolute;transform-origin:50% 50%;will-change:transform}
.item img{display:block}
.noshadow img{filter:none}
.shinewrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);mix-blend-mode:screen;opacity:0}
.gl{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
 border:2px solid rgba(255,255,255,.28);border-radius:36px;box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -20px 40px rgba(0,0,0,.15);color:#fff;overflow:hidden}
.gl.w{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(240,244,255,.88));color:#0b1a3d;border-color:rgba(255,255,255,.9)}
.gold{background:linear-gradient(180deg,#fff3c4 0%,#ffd45c 40%,#e9a312 60%,#ffd96b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.12em .04em .02em}
.red{background:linear-gradient(180deg,#ff6b6b,#e3262f 55%,#a5101a);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.12em .04em .02em}
.lab{font:600 30px/1.3 P;color:rgba(255,255,255,.7);letter-spacing:1px}
.h1{font:800 64px/1.25 P;color:#fff}
.pill{display:inline-block;font:700 40px/1 P;padding:20px 38px 16px;border-radius:999px;white-space:nowrap}
.p-gold{background:linear-gradient(180deg,#ffd45c,#e9a312);color:#2a1a00;box-shadow:0 14px 34px rgba(233,163,18,.45),inset 0 2px 0 rgba(255,255,255,.6)}
.p-red{background:linear-gradient(180deg,#ff5a5f,#d11a24);color:#fff;box-shadow:0 14px 34px rgba(209,26,36,.5),inset 0 2px 0 rgba(255,255,255,.4)}
.p-glass{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(14px)}
.chipw{text-align:center}
/* book */
.bk{position:relative;transform-style:preserve-3d}
.bk .f{position:absolute;left:0;top:0;backface-visibility:hidden}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none}
#grain{mix-blend-mode:overlay;opacity:.06}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
</style></head><body>
<div id="root">
 <div id="grid"></div><div id="spot"></div><div id="tint"></div>
 <canvas id="fxb" width="1080" height="1920"></canvas>
 <div id="vig"></div>
 <div id="cam"><div id="stage"></div><canvas id="fx" width="1080" height="1920"></canvas></div>
 <div id="flash"></div>
 <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<script src="mh.js"></script><script src="engine.js"></script><script src="fx.js"></script><script src="lib.js"></script><script src="scenes2.js"></script>
<script>
let fxb,fx,gr;const TINTS=[];
function seek(t){
  const c=camAt(t);document.getElementById('cam').style.transform=`translate(${c.x*.5}px,${c.y*.5}px) rotate(${c.r}deg) scale(${c.s})`;
  document.getElementById('grid').style.transform=`translate(${(t*6)%90}px,${(t*9)%90}px)`;
  for(const o of ITEMS)renderItem(o,t);
  for(const h of HOOKS)h(t);
  fx.clearRect(0,0,W,H);drawParts(fx,t);
  fxb.clearRect(0,0,W,H);drawBokeh(fxb,t);drawSpeed(fxb,t);
  let fo=0,fcol='#fff';for(const f of FLASH){const d=t-f.t;if(d>=0&&d<.6){const v=f.a*Math.exp(-d*7);if(v>fo){fo=v;fcol=f.c}}}
  const fl=document.getElementById('flash');fl.style.opacity=fo;fl.style.background=fcol;
  const g=grains[Math.floor(t*24)%grains.length];gr.clearRect(0,0,W,H);gr.drawImage(g,0,0,1080,1920);
}
async function init(){
  fxb=document.getElementById('fxb').getContext('2d');fx=document.getElementById('fx').getContext('2d');gr=document.getElementById('grain').getContext('2d');
  makeGrain();buildScenes();
  for(const w of [400,500,600,700,800,900]){await document.fonts.load(w+' 50px P','अआ123')}await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>0)));
  window.READY=true;
}
init();
</script></body></html>
