</style></head><body>
<div id="root">
 <div id="bgs"></div><div id="tint"></div><div id="rays"></div>
 <canvas id="fxb" width="1080" height="1920"></canvas>
 <div id="vig"></div>
 <div id="cam"><div id="stage"></div><canvas id="fx" width="1080" height="1920"></canvas></div>
 <div id="hud"><div id="logo"><div class="lg1">स्पर्धा</div><div class="lg2">टाइम्स</div></div><div id="era"></div><div id="head"></div><div id="tl"></div></div>
 <div id="flash"></div>
 <canvas id="grain" width="1080" height="1920"></canvas>
</div>
<script src="geo.js"></script>
<script src="engine.js"></script><script src="fx.js"></script><script src="hud.js"></script><script src="globe.js"></script><script src="helpers.js"></script><script src="scenes2.js"></script>
<script>
const POST=[];const TINTS=[];function TINT(t0,t1,css){TINTS.push({t0,t1,css})}
let fxb,fx,gr;
function seek(t){
  for(const b of BGS)renderBG(b,t);
  // tint
  const ti=document.getElementById('tint');let tc='';let to=0;for(const k of TINTS){if(t>=k.t0-.4&&t<=k.t1+.4){tc=k.css;to=Math.min(clamp((t-k.t0+.4)/.8),clamp((k.t1+.4-t)/.8))}}
  ti.style.background=tc;ti.style.opacity=to;
  const c=camAt(t);document.getElementById('cam').style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${c.s})`;
  for(const b of BGS)b.el.style.translate=`${c.x*.4}px ${c.y*.4}px`;
  for(const o of ITEMS)renderItem(o,t);
  for(const h of HOOKS)h(t);
  fx.clearRect(0,0,W,H);drawParts(fx,t);
  fxb.clearRect(0,0,W,H);drawSpeed(fxb,t);
  let fo=0,fcol='#fff';for(const f of FLASH){const d=t-f.t;if(d>=0&&d<.6){const v=f.a*Math.exp(-d*7);if(v>fo){fo=v;fcol=f.c}}}
  const fl=document.getElementById('flash');fl.style.opacity=fo;fl.style.background=fcol;
  renderHead(t);renderTimeline(t);for(const h of POST)h(t);
  const g=grains[Math.floor(t*24)%grains.length];gr.clearRect(0,0,W,H);gr.drawImage(g,0,0,1080,1920);
}
async function init(){
  fxb=document.getElementById('fxb').getContext('2d');fx=document.getElementById('fx').getContext('2d');gr=document.getElementById('grain').getContext('2d');
  makeGrain();buildTimeline();
  for(const [n,f] of [['snow','I3_snow'],['drop','I2_rain']]){const im=new Image();im.src='a/'+f+'.png';await im.decode().catch(e=>console.log('BADC '+f));coinImgs[n]=im}
  await loadGlobe();buildScenes();
  for(const w of [500,600,700,800,900]){await document.fonts.load(w+' 50px B','अआ123')}await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>0)));
  for(const b of BGS){const im=new Image();im.src='a/'+b.img;await im.decode().catch(e=>console.log('BAD '+b.img))}
  window.READY=true;
}
init();
</script></body></html>
